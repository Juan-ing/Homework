<section class="auth-card">
  <h1>Inicia sesión</h1>
  <p class="intro">Continúa organizando tus tareas.</p>
  <form (ngSubmit)="submit()">
    <label class="form-label" for="email">Correo electrónico</label>
    <input class="form-control" id="email" name="email" type="email" [(ngModel)]="email" autocomplete="email" required />

    <label class="form-label" for="password">Contraseña</label>
    <input class="form-control" id="password" name="password" type="password" [(ngModel)]="password" autocomplete="current-password" required />

    @if (errorMessage()) {
      <p class="alert alert-danger" role="alert">{{ errorMessage() }}</p>
    }
    <button class="btn btn-primary w-100" type="submit" [disabled]="isSubmitting()">
      {{ isSubmitting() ? 'Ingresando…' : 'Iniciar sesión' }}
    </button>
  </form>
  <p class="mb-0 mt-3 text-center">¿No tienes cuenta? <a routerLink="/register">Regístrate</a></p>
</section>
