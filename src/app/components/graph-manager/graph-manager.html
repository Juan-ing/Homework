<section class="panel">
  <h2>Administrar el grafo</h2>
  <div class="forms">
    <form (ngSubmit)="addCity()">
      <h3>Crear ciudad</h3>
      <label for="city-name">Nombre</label>
      <input id="city-name" name="cityName" [(ngModel)]="cityName" required />
      <button type="submit">Agregar ciudad</button>
    </form>

    <form (ngSubmit)="addPerson()">
      <h3>Crear persona</h3>
      <label for="person-name">Nombre</label>
      <input id="person-name" name="personName" [(ngModel)]="personName" required />
      <label for="person-age">Edad</label>
      <input
        id="person-age"
        name="personAge"
        type="number"
        min="0"
        step="1"
        [(ngModel)]="personAge"
        required
      />
      <label for="person-city">Ciudad</label>
      <select id="person-city" name="personCityId" [(ngModel)]="personCityId" required>
        @for (city of cities(); track city.id) {
          <option [value]="city.id">{{ city.name }}</option>
        }
      </select>
      <button type="submit" [disabled]="cities().length === 0">Agregar persona</button>
    </form>

    <form (ngSubmit)="assignCity()">
      <h3>Asignar ciudad</h3>
      <label for="assignment-person">Persona</label>
      <select
        id="assignment-person"
        name="selectedPersonId"
        [(ngModel)]="selectedPersonId"
        required
      >
        <option value="">Selecciona una persona</option>
        @for (person of people(); track person.id) {
          <option [value]="person.id">{{ person.name }}</option>
        }
      </select>
      <label for="assignment-city">Ciudad</label>
      <select
        id="assignment-city"
        name="reassignedCityId"
        [(ngModel)]="reassignedCityId"
        required
      >
        @for (city of cities(); track city.id) {
          <option [value]="city.id">{{ city.name }}</option>
        }
      </select>
      <button type="submit" [disabled]="people().length === 0 || cities().length === 0">
        Asignar ciudad
      </button>
    </form>
  </div>

  @if (message) {
    <p class="message" [class.error]="messageType === 'error'" role="status">{{ message }}</p>
  }
</section>
