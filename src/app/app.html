<main class="clinic-shell">
  <header class="topbar">
    <h1>{{ title() }}</h1>

    <nav class="nav" aria-label="Navegación principal">
      <button type="button" [class.active]="activeSection() === 'waiting-list'" (click)="changeSection('waiting-list')">Pacientes</button>
      <button type="button" [class.active]="activeSection() === 'history-list'" (click)="changeSection('history-list')">Historial</button>
      <button type="button" [class.active]="activeSection() === 'doctors-rotation'" (click)="changeSection('doctors-rotation')">Guardias</button>
      <button type="button" [class.active]="activeSection() === 'committee'" (click)="changeSection('committee')">Comité</button>
    </nav>
  </header>

  <section class="dashboard">
    @if (activeSection() === 'waiting-list') {
      <app-waiting-list
        [patients]="waitingPatients.toArray()"
        (patientAttended)="onPatientAttended($event)"
      ></app-waiting-list>
    }

    @if (activeSection() === 'history-list') {
      <app-history-list [patients]="attendedHistory.toArray()"></app-history-list>
    }

    @if (activeSection() === 'doctors-rotation') {
      <app-doctors-rotation></app-doctors-rotation>
    }

    @if (activeSection() === 'committee') {
      <app-committee [members]="committee.toArray()"></app-committee>
    }
  </section>
</main>
